[package]
name = "xray-rs"
version = "3.5.1"
edition = "2024"
authors = ["abc15018045126", "Xray Rust Team"]
description = "High-performance Rust implementation of Xray-core with XTLS Vision, Reality, and TUN support."
repository = "https://github.com/abc15018045126/xray-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["xray", "vless", "vision", "reality", "tun"]
categories = ["network-programming", "cryptography"]
exclude = ["1/", "testing/", "target/", "*.dll", "*.exe", "*.dat", "*.apk", "*.aar"]

[lib]
name = "xray_core"
path = "src/lib.rs"

[[bin]]
name = "xray"
path = "main/main.rs"

[[bin]]
name = "benchmark"
path = "main/benchmark.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec", "io"] }
bytes = "1.12.2"
h2 = "0.4.21"
http = "1.5.0"
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.21"
anyhow = "1.0.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.3", features = ["v4", "v5", "serde"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"
rustls-pki-types = "1.16.0"
rcgen = "0.14.10"
clap = { version = "4.6.10", features = ["derive"] }
rand = "0.10.4"
httparse = "1.10.1"
socket2 = { version = "0.6.5", features = ["all"] }
sha2 = "0.11.2"
blake3 = "1.8.7"
ml-kem = { version = "=0.3.4", features = ["zeroize"] }
hex = "0.4.3"
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
tokio-tungstenite = "0.30.0"
md-5 = "0.11.0"
regex = "1.13.2"
sha1 = "0.11.0"
base64 = "0.23.1"
network-interface = "2.0.5"
ipnet = "2.12.2"
ahash = "0.8.14"
etherparse = "0.21.1"
log = "0.4.35"
pingora-pool = "0.9.1"
pingora-http = "0.9.1"
pingora-timeout = "0.9.1"
hickory-resolver = { version = "0.26.4", features = ["system-config", "tokio", "https-ring", "tls-ring", "webpki-roots"] }
hickory-proto = "0.26.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
pingora-core = { version = "0.9.1", features = ["rustls"] }
pingora-load-balancing = { version = "0.9.1", features = ["rustls"] }

[target.'cfg(all(not(windows), not(target_os = "android")))'.dependencies]
tun = { version = "0.8.15", features = ["async"] }

[target.'cfg(windows)'.dependencies]
xray-rs-window = "0.1.0"
wintun = { package = "wintun-rs", version = "0.0.6" }
windows = { version = "0.62.2", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
module_inception = "allow"
type_complexity = "allow"
