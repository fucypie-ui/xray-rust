name: Classic Shadowsocks reference

on:
  push:
    paths:
      - .github/workflows/classic-shadowsocks.yml
      - .github/scripts/run-required-rust-tests.py
      - .github/scripts/audit-direct-dependencies.py
      - Cargo.toml
      - Cargo.lock
      - md/DEPENDENCY_UPGRADE.json
      - infra/conf/shadowsocks.rs
      - infra/conf/conf.rs
      - proxy/shadowsocks/**
      - testing/shadowsocks-reference/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  reference:
    name: Bidirectional classic AEAD reference bytes (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Rust and helper sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out authoritative Go source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: XTLS/Xray-core
          ref: 67756b3674d56b72c7a7e675e8dcd3f883e1b2f7
          path: go-reference
          persist-credentials: false

      - name: Install reference Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go-reference/go.mod
          cache-dependency-path: go-reference/go.sum

      - name: Generate independent Go classic request and response bytes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          [[ $(git -C go-reference rev-parse HEAD) == 67756b3674d56b72c7a7e675e8dcd3f883e1b2f7 ]]
          bash testing/shadowsocks-reference/generate.sh "$GITHUB_WORKSPACE/go-reference" "$GITHUB_WORKSPACE/classic-reference"
          grep -F -- '--- PASS: TestRustClassicReferenceVectors' classic-reference/shadowsocks-go.log
          [[ -z $(git -C go-reference status --porcelain) ]]

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: classic-reference
          cache-on-failure: true

      - name: Verify direct dependency versions and approved source override
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/classic-metadata.json"
          python3 .github/scripts/audit-direct-dependencies.py --verify-metadata "$RUNNER_TEMP/classic-metadata.json" > classic-reference/root-direct-resolution.json

      - name: Require Go bytes through Rust inbound and outbound traits
        timeout-minutes: 25
        env:
          SS_CLASSIC_GO_VECTORS: ${{ github.workspace }}/classic-reference/shadowsocks-go.jsonl
          SS_CLASSIC_RUST_VECTORS: ${{ github.workspace }}/classic-reference/shadowsocks-rust.jsonl
        run: python3 .github/scripts/run-required-rust-tests.py proxy::shadowsocks::runtime_test::independent_pinned_go_fixtures_both_directions_through_traits 1 --ignored

      - name: Require Go production decoders to accept Rust trait output
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test -s classic-reference/shadowsocks-rust.jsonl
          bash testing/shadowsocks-reference/generate.sh "$GITHUB_WORKSPACE/go-reference" "$GITHUB_WORKSPACE/classic-reverse" "$GITHUB_WORKSPACE/classic-reference/shadowsocks-rust.jsonl"
          grep -F -- '--- PASS: TestRustClassicReferenceDecode' classic-reverse/shadowsocks-rust-decode.log
          git -C go-reference diff --exit-code
          [[ -z $(git -C go-reference status --porcelain) ]]
          git rev-parse HEAD > classic-reference/rust-source-commit.txt
          git -C go-reference rev-parse HEAD > classic-reference/go-source-commit.txt
          go version > classic-reference/setup-go-version.txt
          GOTOOLCHAIN=go1.27.0 go version > classic-reference/helper-go-toolchain.txt
          sha256sum classic-reference/*.jsonl classic-reverse/*.jsonl > classic-reference/SHA256SUMS

      - name: Save reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: classic-shadowsocks-reference
          path: |
            classic-reference/
            classic-reverse/
          if-no-files-found: error
          retention-days: 14
