name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Check, build, and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Keep compiled dependencies useful while the port still has compile errors.
          cache-on-failure: true

      - name: Report toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check all targets with locked dependencies
        timeout-minutes: 20
        run: cargo check --locked --all-targets

      - name: Build the library and binaries
        timeout-minutes: 20
        run: cargo build --locked --lib --bins

      # Scenario tests are modules in the library, so --all-targets includes them.
      # Serial execution reduces interference from global state, files, and sockets.
      - name: Run unit and scenario tests
        timeout-minutes: 30
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=1

      - name: Compare built key commands with pinned Go vectors
        timeout-minutes: 5
        run: python3 .github/scripts/check-key-cli-parity.py target/debug/xray testing/crypto-reference/vectors.json

      # Cargo's --all-targets does not include documentation tests.
      - name: Run documentation tests
        timeout-minutes: 10
        run: cargo test --locked --doc --no-fail-fast -- --test-threads=1

  release:
    name: Release build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
          cache-on-failure: true

      # Release excludes cfg(debug_assertions) modules and enables LTO in Cargo.toml.
      - name: Build release library and binaries with locked dependencies
        timeout-minutes: 50
        run: cargo build --locked --release --lib --bins
