name: Mux close stress probe
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact Rust source revision to exercise
        required: true
        default: ccaffb033487d0075da64b6df40dc8007107f9c4
      baseline_ref:
        description: Optional baseline runtime for deterministic red proof
        required: false
        default: ""
      repetitions:
        description: Number of nonempty selected test invocations
        required: true
        default: "40"
permissions:
  contents: read
jobs:
  probe:
    name: Concurrent Mux close repetitions (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Repeat exact concurrent close regression
        timeout-minutes: 30
        env:
          EXPECTED_SOURCE: ${{ inputs.source_ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          REPETITIONS: ${{ inputs.repetitions }}
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,sys,subprocess,json
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['EXPECTED_SOURCE'],source
          count=int(os.environ['REPETITIONS']);assert 1<=count<=100
          output=Path('mux-close-evidence');output.mkdir()
          (output/'source.txt').write_text(source+'\n')
          prefix='common::mux::runtime_test::'
          selected=prefix+'concurrent_tcp_and_udp_sessions_preserve_bytes_packets_and_metadata'
          eof=prefix+'peer_eof_cancels_pending_terminal_write_without_carrier_error'
          live=prefix+'terminal_write_failure_with_open_peer_remains_carrier_error'
          def invoke(name,label):
              log=output/(label+'.log')
              with log.open('w') as stream:
                  result=subprocess.run([sys.executable,'.github/scripts/run-required-rust-tests.py',name,'1'],stdout=stream,stderr=subprocess.STDOUT)
              text=log.read_text()
              passed=result.returncode==0 and f'Required gate passed: {name} (1 executed tests)' in text
              return {'label':label,'test':name,'returncode':result.returncode,'passed':passed},text
          baseline=os.environ.get('BASELINE_REF','')
          red=[]
          runtime=Path('common/mux/runtime.rs');frozen_runtime=runtime.read_bytes()
          if baseline:
              try:
                  runtime.write_bytes(subprocess.check_output(['git','show',baseline+':common/mux/runtime.rs']))
                  for index in range(5):
                      result,text=invoke(eof,f'baseline-eof-{index+1:03d}')
                      result['expected_failure']=result['returncode']!=0 and '0 passed; 1 failed; 0 ignored;' in text and 'BrokenPipe' in text and eof in text
                      red.append(result)
                      print('baseline regression: '+json.dumps(result),flush=True)
                      if not result['expected_failure']:print('\n'.join(text.splitlines()[-65:]),flush=True)
              finally:
                  runtime.write_bytes(frozen_runtime)
          assert subprocess.check_output(['git','diff','--exit-code','--','common/mux/runtime.rs'],text=True)==''
          results=[]
          for name,label in [(eof,'fixed-eof'),(live,'fixed-open-peer')]:
              for index in range(10):
                  result,text=invoke(name,f'{label}-{index+1:03d}');results.append(result)
                  print('fixed regression: '+json.dumps(result),flush=True)
                  if not result['passed']:print('\n'.join(text.splitlines()[-65:]),flush=True)
          for index in range(count):
              result,text=invoke(selected,f'iteration-{index+1:03d}');result['iteration']=index+1;results.append(result)
              print(f'iteration {index+1}/{count}: '+('PASS' if result['passed'] else 'FAIL'),flush=True)
              if not result['passed']:print('\n'.join(text.splitlines()[-75:]),flush=True)
          summary={'source':source,'baseline_runtime_ref':baseline,'regression_source':source,'baseline_regressions':red,'filter':selected,'repetitions':count,'passed':sum(r['passed'] for r in results),'executions':len(results),'results':results}
          (output/'result.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary),flush=True)
          sys.exit(0 if all(r['passed'] for r in results) and all(r['expected_failure'] for r in red) else 1)
          PY
      - name: Save each test invocation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mux-close-evidence
          path: mux-close-evidence/
          if-no-files-found: error
          retention-days: 14
