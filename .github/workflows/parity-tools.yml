name: Parity preparation

on:
  push:
    paths:
      - .github/workflows/parity-tools.yml
      - .github/scripts/prepare-parity-dependencies.py
      - testing/crypto-reference/**
      - testing/ss2022-reference/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Prepare dependency lockfile (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Prepare cryptographic dependencies
        run: python3 .github/scripts/prepare-parity-dependencies.py
      - name: Resolve new dependencies conservatively without compiling
        run: |
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Save prepared manifest and lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-dependency-lock
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 7
