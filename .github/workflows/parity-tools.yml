name: Parity preparation

on:
  push:
    paths:
      - .github/workflows/parity-tools.yml
      - .github/scripts/prepare-parity-dependencies.py
      - testing/crypto-reference/**
      - testing/ss2022-reference/**
      - proxy/shadowsocks_2022/testdata/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Prepare dependency lockfile (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Prepare cryptographic dependencies
        run: python3 .github/scripts/prepare-parity-dependencies.py
      - name: Resolve new dependencies conservatively without compiling
        run: |
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Save prepared manifest and lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-dependency-lock
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 7

  reference:
    name: Generate pinned Go reference fixtures (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Check out Rust port and fixture generators
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out authoritative Go snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: XTLS/Xray-core
          ref: 67756b3674d56b72c7a7e675e8dcd3f883e1b2f7
          path: go-reference
          persist-credentials: false
      - name: Install reference Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go-reference/go.mod
          cache-dependency-path: go-reference/go.sum
      - name: Generate independent key and protocol vectors
        run: |
          bash testing/crypto-reference/generate.sh "$GITHUB_WORKSPACE/go-reference" "$GITHUB_WORKSPACE/reference-fixtures"
          bash testing/ss2022-reference/generate.sh "$GITHUB_WORKSPACE/go-reference" "$GITHUB_WORKSPACE/reference-fixtures"
          git -C go-reference rev-parse HEAD > reference-fixtures/source-commit.txt
          go version > reference-fixtures/go-version.txt
      - name: Verify frozen fixtures against regenerated Go output
        run: |
          if [[ -f testing/crypto-reference/vectors.json ]]; then
            cmp reference-fixtures/vectors.json testing/crypto-reference/vectors.json
          fi
          if [[ -f proxy/shadowsocks_2022/testdata/go-vectors.jsonl ]]; then
            cmp reference-fixtures/ss2022-vectors.jsonl proxy/shadowsocks_2022/testdata/go-vectors.jsonl
          fi
      - name: Save Go vectors and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-reference-fixtures
          path: reference-fixtures/
          if-no-files-found: error
          retention-days: 7
