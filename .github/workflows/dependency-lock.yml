name: Latest dependency validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  resolve:
    name: Resolve and audit both dependency graphs (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Report Linux toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose
      - name: Resolve root and nested manifests against stable registry evidence
        run: |
          cargo update
          cargo metadata --locked --format-version 1 > root-metadata.json
          python3 .github/scripts/audit-direct-dependencies.py --verify-metadata root-metadata.json > root-direct-resolution.json
          cargo update --manifest-path debug_panel/dioxus_app/Cargo.toml
          cargo metadata --locked --manifest-path debug_panel/dioxus_app/Cargo.toml --format-version 1 > desktop-metadata.json
          python3 .github/scripts/audit-direct-dependencies.py --verify-metadata desktop-metadata.json --manifest debug_panel/dioxus_app/Cargo.toml > desktop-direct-resolution.json
      - name: Save Linux locks and resolver evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latest-dependency-locks
          path: |
            Cargo.lock
            debug_panel/dioxus_app/Cargo.lock
            root-direct-resolution.json
            desktop-direct-resolution.json
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Check Dioxus desktop app (Linux)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install native WebKit and GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: latest-dependency-locks
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: debug_panel/dioxus_app -> target
          cache-on-failure: true
      - name: Check all debug desktop targets with strict warnings
        run: cargo check --locked --manifest-path debug_panel/dioxus_app/Cargo.toml --all-targets
