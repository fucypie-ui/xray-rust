name: Independent engine references

on:
  push:
    paths:
      - .github/workflows/engine-reference.yml
      - testing/config-reference/**
      - testing/hysteria-reference/**
      - testing/kcp-reference/**
      - testing/reality-reference/**
      - testing/vmess-reference/**
      - testing/wireguard-reference/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Pinned Go reference (${{ matrix.engine }}, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [config, hysteria, kcp, reality, vmess, wireguard]
    env:
      GOTOOLCHAIN: auto
      REFERENCE_ENGINE: ${{ matrix.engine }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reference generators
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out authoritative Go source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: XTLS/Xray-core
          ref: 67756b3674d56b72c7a7e675e8dcd3f883e1b2f7
          path: go-reference
          persist-credentials: false

      - name: Install reference Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go-reference/go.mod
          cache-dependency-path: go-reference/go.sum

      - name: Generate independent engine reference
        run: |
          set -euo pipefail
          output_directory="$GITHUB_WORKSPACE/reference-fixtures/$REFERENCE_ENGINE"
          mkdir -p -- "$output_directory"
          actual_commit=$(git -C go-reference rev-parse HEAD)
          [[ $actual_commit == 67756b3674d56b72c7a7e675e8dcd3f883e1b2f7 ]]
          printf '%s\n' "$actual_commit" > "$output_directory/source-commit.txt"
          git rev-parse HEAD > "$output_directory/generator-commit.txt"
          go version > "$output_directory/go-version.txt"
          bash "testing/$REFERENCE_ENGINE-reference/generate.sh" \
            "$GITHUB_WORKSPACE/go-reference" "$output_directory" \
            2>&1 | tee "$output_directory/generator.log"
          git -C go-reference diff --exit-code
          [[ -z $(git -C go-reference status --porcelain) ]]
          (
            cd -- "$output_directory"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Save reference output and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-reference-${{ matrix.engine }}
          path: reference-fixtures/${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 14
